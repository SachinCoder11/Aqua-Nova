<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Tank Animation</title>
    <link rel="stylesheet" href="Animation.css">
    <link rel="icon" type="image/svg+xml" href="" />

</head>
<body>
    <div class="container">
        <div class="fish-container">
            <img src="fishes.svg" class="smallFish fish">
            <img src="clown-fish.svg" class="fish1 fish">
            <img src="fish2.svg" class="fish2 fish">
            <img src="fish.svg" class="fish3 fish">
        </div>

        <div class="bubble-container">
            <img src="bubbles.svg" class="bubble1">
            <img src="bubbles.svg" class="bubble2">
            <img src="bubbles.svg" class="bubble3">
        </div>

        <!-- 🚦 Traffic Signal -->
        <div class="signal">
            <div class="light red"></div>
            <div class="light yellow"></div>
            <div class="light green"></div>
        </div>
    </div>

    <!-- Add JavaScript file -->
    <script src="Animation.js"></script>
</body>
</html>
